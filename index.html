<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration Road Scene</title>
<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  width:100%;
  height:100%;
  background:black; 
}
canvas { display:block; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, vpX, vpY;
let poles = [];
const POLE_COUNT = 6;
const edgeOffset = 50;
let dashOffset = 0;
let skyTime = 0;

/* ---------- RESIZE ---------- */
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  vpX = w / 2;
  vpY = h * 0.55;
  createPoles();
}
window.addEventListener("resize", resize);
resize();

/* ---------- POLES ---------- */
function createPoles(){
  poles = [];
  for(let i = 0; i < POLE_COUNT; i++){
    poles.push({ t: i / (POLE_COUNT - 1) });
  }
}

/* ---------- COLOR LERP ---------- */
function lerpColor(c0, c1, f){
  function hex2rgb(h){
    const n = parseInt(h.slice(1),16);
    return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
  }
  const a = hex2rgb(c0);
  const b = hex2rgb(c1);
  return `rgb(${(a.r+(b.r-a.r)*f)|0},
              ${(a.g+(b.g-a.g)*f)|0},
              ${(a.b+(b.b-a.b)*f)|0})`;
}

/* ---------- SKY ---------- */
function drawSky(){
  skyTime += 0.0005;
  if(skyTime > 1) skyTime = 0;

  const colors = [
    {t:0,   top:"#c95a3a", mid:"#5a246d", bottom:"#0b1026"},
    {t:0.25,top:"#050a1f", mid:"#0b1026", bottom:"#1a1a3a"},
    {t:0.5, top:"#f6b26b", mid:"#c95a3a", bottom:"#5a246d"},
    {t:0.75,top:"#87ceeb", mid:"#5ac3d1", bottom:"#c95a3a"},
    {t:1,   top:"#c95a3a", mid:"#5a246d", bottom:"#0b1026"}
  ];

  let i = 0;
  while(i < colors.length-1 && skyTime > colors[i+1].t) i++;

  const f = (skyTime - colors[i].t) / (colors[i+1].t - colors[i].t);

  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, lerpColor(colors[i].top, colors[i+1].top, f));
  grad.addColorStop(0.5, lerpColor(colors[i].mid, colors[i+1].mid, f));
  grad.addColorStop(1, lerpColor(colors[i].bottom, colors[i+1].bottom, f));

  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

/* ---------- ROAD ---------- */
function drawRoad(){
  ctx.fillStyle = "#333";
  ctx.beginPath();
  ctx.moveTo(vpX, vpY);
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fill();

  dashOffset -= 2;
  ctx.setLineDash([30,30]);
  ctx.lineDashOffset = dashOffset;
  ctx.strokeStyle = "yellow";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(vpX, vpY);
  ctx.lineTo(w/2, h);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ---------- POLES ---------- */
function drawPoles(){
  ctx.fillStyle = "saddlebrown";
  for(let p of poles){
    p.t += 0.002;
    if(p.t > 1) p.t = 0;

    const y = vpY + (h - vpY) * p.t;
    const xL = vpX - (vpX - edgeOffset) * p.t;
    const xR = vpX + (w - vpX - edgeOffset) * p.t;

    const height = (h - vpY) * p.t + 20;
    const width = 10 * p.t + 2;

    ctx.fillRect(xL - width/2, y - height, width, height);
    ctx.fillRect(xR - width/2, y - height, width, height);
  }
}


/* ---------- POWER LINES ---------- */
function drawPowerLines(){
  ctx.strokeStyle = "red";
  ctx.lineWidth = 2;
  const topY = h * 0.75;
  const botY = h * 0.77;

  ctx.beginPath(); ctx.moveTo(vpX,vpY); ctx.lineTo(edgeOffset,topY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(vpX,vpY); ctx.lineTo(edgeOffset+40,botY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(vpX,vpY); ctx.lineTo(w-edgeOffset,topY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(vpX,vpY); ctx.lineTo(w-edgeOffset-40,botY); ctx.stroke();
}

/* ---------- ANIMATE ---------- */
function animate(){
  drawSky();
  drawPoles();
  drawRoad();
  drawPowerLines();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
