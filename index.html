<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration Road Powerlines to Tallest Pole</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black;}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, vpX, vpY;
let poles = [];
const poleCount = 6;
const edgeOffset = 50;
let dashOffset = 0;

function resetCanvas() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    vpX = w/2;
    vpY = h*2/3;

    poles = [];
    for(let i=0;i<poleCount;i++){
        poles.push({t: i/(poleCount-1)});
    }
}
window.addEventListener("resize", resetCanvas);
resetCanvas();

/* ---------- SKY ---------- */
function drawSky(){
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, "orange");
    grad.addColorStop(1, "darkblue");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
}

/* ---------- ROAD ---------- */
function drawRoad(){
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.moveTo(vpX, vpY);
    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fill();

    dashOffset += 1.5;
    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 4;
    ctx.setLineDash([30,30]);
    ctx.lineDashOffset = -dashOffset;
    ctx.beginPath();
    ctx.moveTo(vpX, vpY);
    ctx.lineTo(w/2, h);
    ctx.stroke();
    ctx.setLineDash([]);
}

/* ---------- POLES ---------- */
function drawPoles(){
    ctx.fillStyle = "saddlebrown";

    let leftTallest = null;
    let rightTallest = null;

    for(let i=0;i<poles.length;i++){
        let p = poles[i];
        p.t += 0.003;
        if(p.t > 1) p.t = 0;

        const y = vpY + (h - vpY) * p.t;
        const xLeft = vpX - (vpX - edgeOffset) * p.t;
        const xRight = vpX + (w - vpX - edgeOffset) * p.t;
        const poleHeight = 1 + 200*p.t;
        const poleWidth = Math.max(1, 1 + 10*p.t);

        const topYLeft = y - poleHeight;
        const topYRight = y - poleHeight;

        ctx.fillRect(xLeft - poleWidth/2, topYLeft, poleWidth, poleHeight);
        ctx.fillRect(xRight - poleWidth/2, topYRight, poleWidth, poleHeight);

        // record tallest visible pole tops
        if(!leftTallest || topYLeft < leftTallest.y) leftTallest = {x: xLeft, y: topYLeft};
        if(!rightTallest || topYRight < rightTallest.y) rightTallest = {x: xRight, y: topYRight};
    }

    drawPowerLines(leftTallest, rightTallest);
}

/* ---------- POWERLINES TO TALLEST POLE ---------- */
function drawPowerLines(leftTop, rightTop){
    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;

    if(leftTop){
        ctx.beginPath();
        ctx.moveTo(vpX, vpY);
        ctx.lineTo(leftTop.x - 10, leftTop.y); // left line 1
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(vpX, vpY);
        ctx.lineTo(leftTop.x - 30, leftTop.y); // left line 2
        ctx.stroke();
    }

    if(rightTop){
        ctx.beginPath();
        ctx.moveTo(vpX, vpY);
        ctx.lineTo(rightTop.x + 10, rightTop.y); // right line 1
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(vpX, vpY);
        ctx.lineTo(rightTop.x + 30, rightTop.y); // right line 2
        ctx.stroke();
    }
}
