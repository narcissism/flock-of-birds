<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration Road Test</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black;}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Variables that depend on canvas size
let w, h, horizonY, poles;
const poleCount = 12;
const roadWidth = 100;

function resetCanvas() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    horizonY = h * 0.3;

    // Initialize poles evenly between horizonY and bottom
    poles = [];
    for(let i=0; i<poleCount; i++){
        poles.push({y: horizonY + i*(h - horizonY)/poleCount});
    }
}
window.addEventListener("resize", resetCanvas);
resetCanvas(); // initial setup

/* ---------- SKY ---------- */
const skyStages = [
  {top:[255,100,0], bottom:[255,180,80]}, // Sunset
  {top:[20,30,70], bottom:[30,40,100]},   // Deep Blue
  {top:[0,0,0], bottom:[0,0,0]},          // Night
  {top:[200,120,180], bottom:[255,200,180]}, // Sunrise
  {top:[135,206,250], bottom:[255,255,255]} // Day
];

function clamp(n){ return Math.min(255, Math.max(0, Math.round(n))); }
function lerp(a,b,f){ return clamp(a + (b-a)*f); }

function drawSky(t){
    const cycle = 120000;
    const total = skyStages.length;
    const progress = (t % cycle)/cycle * total;
    const idx = Math.floor(progress);
    const next = (idx + 1) % total;
    const f = progress - idx;

    const top=[], bottom=[];
    for(let i=0;i<3;i++){
        top[i] = lerp(skyStages[idx].top[i], skyStages[next].top[i], f);
        bottom[i] = lerp(skyStages[idx].bottom[i], skyStages[next].bottom[i], f);
    }

    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, `rgb(${top[0]},${top[1]},${top[2]})`);
    grad.addColorStop(1, `rgb(${bottom[0]},${bottom[1]},${bottom[2]})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
}

/* ---------- ROAD & POLES ---------- */
function drawRoadAndPoles(){
    // Draw road
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.moveTo(w/2 - roadWidth, h);
    ctx.lineTo(w/2 + roadWidth, h);
    ctx.lineTo(w/2 + roadWidth, horizonY);
    ctx.lineTo(w/2 - roadWidth, horizonY);
    ctx.closePath();
    ctx.fill();

    // Draw poles and power lines
    ctx.strokeStyle = "#555";
    ctx.lineWidth = 2;
    for(const p of poles){
        const scale = 1 - (p.y - horizonY)/(h - horizonY) * 0.8;
        const y = p.y;
        const leftX = w/2 - 120*scale;
        const rightX = w/2 + 120*scale;
        const poleH = 150*scale;

        // only draw if coordinates are finite
        if(isFinite(y) && isFinite(leftX) && isFinite(rightX) && isFinite(poleH)){
            ctx.beginPath();
            ctx.moveTo(leftX, y); ctx.lineTo(leftX, y - poleH);
            ctx.moveTo(rightX, y); ctx.lineTo(rightX, y - poleH);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(leftX, y - poleH*0.7); ctx.lineTo(rightX, y - poleH*0.7);
            ctx.stroke();
        }
    }
}

function updatePoles(){
    for(const p of poles){
        p.y += 2;
        if(p.y > h) p.y = horizonY;
    }
}

/* ---------- ANIMATE ---------- */
function animate(t){
    drawSky(t);
    updatePoles();
    drawRoadAndPoles();
    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
