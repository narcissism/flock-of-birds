<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration Road Scene</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w,h,vpX,vpY;

function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  vpX = w/2;
  vpY = h*0.55;
}
window.addEventListener("resize",resize);
resize();

/* ---------- DRAW SKY ---------- */
function drawSky(){
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"#0b1026");
  grad.addColorStop(0.5,"#5a246d");
  grad.addColorStop(0.8,"#c95a3a");
  grad.addColorStop(1,"#f6b26b");
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,w,h);
}

/* ---------- DRAW ROAD ---------- */
function drawRoad(){
  ctx.fillStyle="#333";
  ctx.beginPath();
  ctx.moveTo(vpX,vpY);
  ctx.lineTo(w,h);
  ctx.lineTo(0,h);
  ctx.closePath();
  ctx.fill();

  ctx.setLineDash([30,30]);
  ctx.strokeStyle="yellow";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(vpX,vpY);
  ctx.lineTo(w/2,h);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ---------- DRAW POLES ---------- */
function drawPoles(){
  ctx.fillStyle="saddlebrown";
  const POLE_COUNT = 6;
  const edgeOffset = 50;
  for(let i=0;i<POLE_COUNT;i++){
    let t = i/(POLE_COUNT-1);
    const y = vpY + (h - vpY) * t;
    const xLeft = vpX - (vpX - edgeOffset) * t;
    const xRight = vpX + (w - vpX - edgeOffset) * t;
    const poleHeight = 200*t + 10;
    const poleWidth = 10*t + 2;
    ctx.fillRect(xLeft - poleWidth/2, y - poleHeight, poleWidth, poleHeight);
    ctx.fillRect(xRight - poleWidth/2, y - poleHeight, poleWidth, poleHeight);
  }
}

/* ---------- DRAW POWERLINES ---------- */
function drawPowerLines(){
  ctx.strokeStyle="black";
  ctx.lineWidth=2;
  const topY = h*0.75;
  const bottomY = h*0.77;
  const edgeOffset = 50;
  // left
  ctx.beginPath();
  ctx.moveTo(vpX,vpY);
  ctx.lineTo(edgeOffset,topY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(vpX,vpY);
  ctx.lineTo(edgeOffset+40,bottomY);
  ctx.stroke();
  // right
  ctx.beginPath();
  ctx.moveTo(vpX,vpY);
  ctx.lineTo(w-edgeOffset,topY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(vpX,vpY);
  ctx.lineTo(w-edgeOffset-40,bottomY);
  ctx.stroke();
}

/* ---------- ANIMATE ---------- */
function animate(){
  drawSky();
  drawPoles();
  drawRoad();
  drawPowerLines();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
