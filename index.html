<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration Road Refined</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black;}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, vpX, vpY, poles;
const roadBottomHalfWidth = 500;
const poleCount = 6;

function resetCanvas() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    vpX = w/2;
    vpY = h*2/3;

    poles = [];
    for(let i=0;i<poleCount;i++){
        poles.push({t: i/(poleCount-1)});
    }
}
window.addEventListener("resize", resetCanvas);
resetCanvas();

/* ---------- SKY ---------- */
const skyStages = [
  {top:[255,100,0], bottom:[255,180,80]},
  {top:[20,30,70], bottom:[30,40,100]},
  {top:[0,0,0], bottom:[0,0,0]},
  {top:[200,120,180], bottom:[255,200,180]},
  {top:[135,206,250], bottom:[255,255,255]}
];

function clamp(n){ return Math.min(255, Math.max(0, Math.round(n))); }
function lerp(a,b,f){ return clamp(a+(b-a)*f); }

function drawSky(t){
    const cycle = 120000;
    const total = skyStages.length;
    const progress = (t % cycle)/cycle * total;
    const idx = Math.floor(progress);
    const next = (idx + 1) % total;
    const f = progress - idx;

    const top=[], bottom=[];
    for(let i=0;i<3;i++){
        top[i] = lerp(skyStages[idx].top[i], skyStages[next].top[i], f);
        bottom[i] = lerp(skyStages[idx].bottom[i], skyStages[next].bottom[i], f);
    }

    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, `rgb(${top[0]},${top[1]},${top[2]})`);
    grad.addColorStop(1, `rgb(${bottom[0]},${bottom[1]},${bottom[2]})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
}

/* ---------- ROAD ---------- */
let dashOffset = 0;
function drawRoad(){
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.moveTo(vpX, vpY);
    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fill();

    // slower dashed center line
    dashOffset += 2; // slower
    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 4;
    ctx.setLineDash([30,30]);
    ctx.lineDashOffset = -dashOffset;
    ctx.beginPath();
    ctx.moveTo(vpX, vpY);
    ctx.lineTo(w/2, h);
    ctx.stroke();
    ctx.setLineDash([]);
}

/* ---------- POLES ---------- */
function drawPoles(){
    let leftPoles = [], rightPoles = [];
    for(const p of poles){
        p.t += 0.003;
        if(p.t > 1) p.t = 0;

        const y = vpY + (h - vpY)*p.t;
        const leftX = vpX - roadBottomHalfWidth*p.t*1.5;  // extend farther
        const rightX = vpX + roadBottomHalfWidth*p.t*1.5;

        const poleHeight = 0 + 250*p.t; // grow from zero
        const poleWidth = 0 + 20*p.t;

        leftPoles.push({x: leftX, y, poleHeight, poleWidth});
        rightPoles.push({x: rightX, y, poleHeight, poleWidth});
