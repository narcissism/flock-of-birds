<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration Road Stable Powerlines</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black;}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, vpX, vpY;
let poles = [];
const poleCount = 6;
const edgeOffset = 50;
let dashOffset = 0;

// Powerline coordinates
let powerLines = [];

function resetCanvas() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;

    // Vanishing point
    vpX = w/2;
    vpY = h*2/3;

    // End point: 1/4 from bottom
    const endY = h*0.75;

    // Precompute 2 lines per side
    powerLines = [
        {x: vpX, y: vpY, ex: edgeOffset, ey: endY},          // left 1
        {x: vpX, y: vpY, ex: edgeOffset+40, ey: endY},       // left 2
        {x: vpX, y: vpY, ex: w-edgeOffset, ey: endY},        // right 1
        {x: vpX, y: vpY, ex: w-edgeOffset-40, ey: endY}     // right 2
    ];

    // Initialize poles
    poles = [];
    for(let i=0;i<poleCount;i++){
        poles.push({t: i/(poleCount-1)});
    }
}
window.addEventListener("resize", resetCanvas);
resetCanvas();

/* ---------- SKY ---------- */
function drawSky(){
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, "orange");
    grad.addColorStop(1, "darkblue");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
}

/* ---------- ROAD ---------- */
function drawRoad(){
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.moveTo(vpX, vpY);
    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fill();

    dashOffset += 1.5;
    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 4;
    ctx.setLineDash([30,30]);
    ctx.lineDashOffset = -dashOffset;
    ctx.beginPath();
    ctx.moveTo(vpX, vpY);
    ctx.lineTo(w/2, h);
    ctx.stroke();
    ctx.setLineDash([]);
}

/* ---------- POLES ---------- */
function drawPoles(){
    ctx.fillStyle = "saddlebrown";
    for(let p of poles){
        p.t += 0.003;
        if(p.t > 1) p.t = 0;

        const y = vpY + (h - vpY) * p.t;
        const xLeft = vpX - (vpX - edgeOffset) * p.t;
        const xRight = vpX + (w - vpX - edgeOffset) * p.t;
        const poleHeight = 1 + 200*p.t;
        const poleWidth = Math.max(1, 1 + 10*p.t);

        const topLeftY = Math.max(0, y - poleHeight);
        const topRightY = Math.max(0, y - poleHeight);

        ctx.fillRect(xLeft - poleWidth/2, topLeftY, poleWidth, poleHeight);
        ctx.fillRect(xRight - poleWidth/2, topRightY, poleWidth, poleHeight);
    }
}
