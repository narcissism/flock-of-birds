<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black;}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
window.addEventListener("resize", ()=>{ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; });

/* -------- BIRDS -------- */
const birds=[];
const COUNT=340;
for(let i=0;i<COUNT;i++){
  const a=Math.random()*Math.PI*2;
  birds.push({x:Math.random()*w, y:Math.random()*h, vx:Math.cos(a), vy:Math.sin(a), ax:0, ay:0, wing:Math.random()*Math.PI*2});
}

/* -------- SKY STAGES -------- */
const skyStages = [
  {top:[255,100,0], bottom:[255,180,80]},   // Sunset
  {top:[20,30,70], bottom:[30,40,100]},     // Deep Blue
  {top:[0,0,0], bottom:[0,0,0]},            // Night
  {top:[200,120,180], bottom:[255,200,180]},// Sunrise
  {top:[135,206,250], bottom:[255,255,255]} // Day
];

function clamp(n){ return Math.min(255, Math.max(0, Math.round(n))); }
function lerp(a,b,f){ return clamp(a+(b-a)*f); }

function drawSky(t){
  const cycle=120000; // 2 min full loop
  const total=skyStages.length;
  const progress=(t%cycle)/cycle*total;
  const idx=Math.floor(progress);
  const next=(idx+1)%total;
  const f=progress-idx;

  let top=[], bottom=[];
  for(let i=0;i<3;i++){
    top[i]=lerp(skyStages[idx].top[i], skyStages[next].top[i], f);
    bottom[i]=lerp(skyStages[idx].bottom[i], skyStages[next].bottom[i], f);
  }

  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, `rgb(${top[0]},${top[1]},${top[2]})`);
  grad.addColorStop(1, `rgb(${bottom[0]},${bottom[1]},${bottom[2]})`);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,w,h);
}

/* -------- FLOCKING -------- */
function flock(b){
  let ax=0, ay=0, cx=0, cy=0, sx=0, sy=0, n=0;
  for(const o of birds){
    if(o===b) continue;
    const dx=o.x-b.x, dy=o.y-b.y, d=Math.hypot(dx,dy);
    if(d>0 && d<90){ ax+=o.vx; ay+=o.vy; cx+=o.x; cy+=o.y; if(d<22){ sx-=dx/d; sy-=dy/d;} n++; }
  }
  if(n){ ax/=n; ay/=n; cx=cx/n-b.x; cy=cy/n-b.y; b.ax+=ax*0.03; b.ay+=ay*0.03; b.ax+=cx*0.002; b.ay+=cy*0.002; b.ax+=sx*0.06; b.ay+=sy*0.06; }
}

/* -------- ANIMATE -------- */
function animate(t){
  drawSky(t);
  for(const b of birds) flock(b);
  for(const b of birds){
    b.vx+=b.ax; b.vy+=b.ay;
    let speed=Math.hypot(b.vx,b.vy);
