<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration Road Test</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black;}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, vpX, vpY, poles;
const poleCount = 12;
const roadBaseWidth = 300; // half-width at bottom
function resetCanvas() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    vpX = w/2;
    vpY = h*2/3;

    // Initialize poles
    poles = [];
    for(let i=0;i<poleCount;i++){
        // t is from 0 (vanishing point) to 1 (bottom)
        const t = i/(poleCount-1);
        poles.push({t: t});
    }
}
window.addEventListener("resize", resetCanvas);
resetCanvas();

/* ---------- SKY ---------- */
const skyStages = [
  {top:[255,100,0], bottom:[255,180,80]}, // Sunset
  {top:[20,30,70], bottom:[30,40,100]},   // Deep Blue
  {top:[0,0,0], bottom:[0,0,0]},          // Night
  {top:[200,120,180], bottom:[255,200,180]}, // Sunrise
  {top:[135,206,250], bottom:[255,255,255]} // Day
];

function clamp(n){ return Math.min(255, Math.max(0, Math.round(n))); }
function lerp(a,b,f){ return clamp(a+(b-a)*f); }

function drawSky(t){
    const cycle = 120000;
    const total = skyStages.length;
    const progress = (t % cycle)/cycle * total;
    const idx = Math.floor(progress);
    const next = (idx + 1) % total;
    const f = progress - idx;

    const top=[], bottom=[];
    for(let i=0;i<3;i++){
        top[i] = lerp(skyStages[idx].top[i], skyStages[next].top[i], f);
        bottom[i] = lerp(skyStages[idx].bottom[i], skyStages[next].bottom[i], f);
    }

    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, `rgb(${top[0]},${top[1]},${top[2]})`);
    grad.addColorStop(1, `rgb(${bottom[0]},${bottom[1]},${bottom[2]})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
}

/* ---------- ROAD ---------- */
function drawRoad(){
    // road edges
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.moveTo(vpX, vpY); // vanishing point
    ctx.lineTo(w/2 + roadBaseWidth, h);
    ctx.lineTo(w/2 - roadBaseWidth, h);
    ctx.closePath();
    ctx.fill();

    // dashed center line
    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 3;
    ctx.setLineDash([20,20]);
    ctx.beginPath();
    ctx.moveTo(vpX, vpY);
    ctx.lineTo(w/2, h);
    ctx.stroke();
    ctx.setLineDash([]); // reset dash
}

/* ---------- POLES ---------- */
function drawPoles(){
    for(let p of poles){
        // move t downwards to simulate motion
        p.t += 0.005; // speed
        if(p.t > 1) p.t = 0;

        // position along the road sides
        const y = vpY + (h - vpY)*p.t;
        const leftX = vpX - roadBaseWidth*p.t*1.2;
        const rightX = vpX + roadBaseWidth*p.t*1.2;
        const poleHeight = 100 + 150*p.t; // taller near bottom
        ctx.strokeStyle = "saddlebrown";
        ctx.lineWidth = 4*p.t + 1;

        // left pole
        ctx.beginPath();
        ctx.moveTo(leftX, y);
        ctx.lineTo(leftX, y - poleHeight);
        ctx.stroke();
        // right pole
        ctx.beginPath();
        ctx.moveTo(rightX, y);
        ctx.lineTo(rightX, y - poleHeight);
        ctx.stroke();
        // power line
        ctx.beginPath();
        ctx.moveTo(leftX, y - poleHeight*0.7);
        ctx.lineTo(rightX, y - poleHeight*0.7);
        ctx.stroke();
    }
}

/* ---------- ANIMATE ---------- */
function animate(t){
    drawSky(t);
    drawRoad();
    drawPoles();
    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
