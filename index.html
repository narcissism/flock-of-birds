<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration Road Stable Powerlines</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black;}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, vpX, vpY;
let poles = [];
const poleCount = 6;
const edgeOffset = 50;
let dashOffset = 0;

// Powerline end coordinates (precomputed)
let powerLineEnds = [];

function resetCanvas() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    vpX = w/2;
    vpY = h*2/3;

    // Precompute static endpoints for 2 lines per side, slightly higher than before
    powerLineEnds = [
        {x: edgeOffset, y: h - 30},          // left line 1
        {x: edgeOffset + 40, y: h - 30},     // left line 2
        {x: w - edgeOffset, y: h - 30},      // right line 1
        {x: w - edgeOffset - 40, y: h - 30}  // right line 2
    ];

    poles = [];
    for(let i=0;i<poleCount;i++){
        poles.push({t: i/(poleCount-1)});
    }
}
window.addEventListener("resize", resetCanvas);
resetCanvas();

/* ---------- SKY ---------- */
function drawSky(){
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, "orange");
    grad.addColorStop(1, "darkblue");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
}

    ctx.fillStyle = "#333";
    ctx.beginPath();

    ctx.lineTo(0, h);
