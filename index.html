<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration Road Scene</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w,h,vpX,vpY;
const BIRD_COUNT = 340;
const POLE_COUNT = 6;
const edgeOffset = 50;
let dashOffset = 0;
let birds = [];
let poles = [];

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    vpX = w/2;
    vpY = h*0.55;
    createBirds();
    createPoles();
}
window.addEventListener("resize", resize);
resize();

/* ---------- BIRDS ---------- */
function createBirds(){
    birds = [];
    for(let i=0;i<BIRD_COUNT;i++){
        const angle = Math.random() * Math.PI/4 - Math.PI/8; // slightly up/down
        const speed = 1 + Math.random()*2;
        birds.push({
            x: Math.random() * w * 0.1, // start on left 10% of screen
            y: Math.random() * vpY*0.8,
            vx: Math.cos(angle)*speed,   // mostly to right
            vy: Math.sin(angle)*speed,   // slight vertical variation
            ax:0,
            ay:0,
            wing: Math.random()*Math.PI*2
        });
    }
}

}

/* ---------- POLES ---------- */
function createPoles(){
    poles = [];
    for(let i=0;i<POLE_COUNT;i++){
        poles.push({t:i/(POLE_COUNT-1)});
    }
}

/* ---------- SKY ---------- */
const skyStops = [
  { top:[255,100,0], bottom:[255,180,80] }, // Sunset
  { top:[10,10,35], bottom:[20,20,50] },    // Night
  { top:[200,120,180], bottom:[255,200,180] }, // Sunrise
  { top:[135,206,250], bottom:[255,255,255] }  // Day
];

function lerp(a,b,f){return a+(b-a)*f;}
let startTime = performance.now();
function drawSky(){
    const t = performance.now() - startTime;
    const cycleDuration = 40000; // 40s loop
    let totalStops = skyStops.length;
    let loop = (t % cycleDuration)/cycleDuration * totalStops;
    let idx = Math.floor(loop);
    let nextIdx = (idx+1)%totalStops;
    let f = loop - idx;

    const top = skyStops[idx].top.map((v,i)=>Math.floor(lerp(v, skyStops[nextIdx].top[i], f)));
    const bottom = skyStops[idx].bottom.map((v,i)=>Math.floor(lerp(v, skyStops[nextIdx].bottom[i], f)));

    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0, `rgb(${top[0]},${top[1]},${top[2]})`);
    g.addColorStop(1, `rgb(${bottom[0]},${bottom[1]},${bottom[2]})`);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);
}

/* ---------- ROAD ---------- */
function drawRoad(){
    ctx.fillStyle="#333";
    ctx.beginPath();
    ctx.moveTo(vpX,vpY);
    ctx.lineTo(w,h);
    ctx.lineTo(0,h);
    ctx.closePath();
    ctx.fill();

    dashOffset -= 2; 
    ctx.setLineDash([30,30]);
    ctx.lineDashOffset = dashOffset;
    ctx.strokeStyle="yellow";
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(vpX,vpY);
    ctx.lineTo(w/2,h);
    ctx.stroke();
    ctx.setLineDash([]);
}

/* ---------- POLES ---------- */
function drawPoles(){
    ctx.fillStyle="saddlebrown";
    for(let p of poles){
        p.t += 0.002;
        if(p.t>1) p.t=0;

        const y = vpY + (h - vpY)*p.t;
        const xLeft = vpX - (vpX - edgeOffset)*p.t;
        const xRight = vpX + (w - vpX - edgeOffset)*p.t;
        const poleHeight = 200*p.t + 10;
        const poleWidth = 10*p.t + 2;

        ctx.fillRect(xLeft - poleWidth/2, y - poleHeight, poleWidth, poleHeight);
        ctx.fillRect(xRight - poleWidth/2, y - poleHeight, poleWidth, poleHeight);
    }
}

/* ---------- POWERLINES ---------- */
function drawPowerLines(){
    ctx.strokeStyle="black";
    ctx.lineWidth=2;
    const topY = h*0.75;
    const bottomY = h*0.77;

    ctx.beginPath(); ctx.moveTo(vpX,vpY); ctx.lineTo(edgeOffset,topY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(vpX,vpY); ctx.lineTo(edgeOffset+40,bottomY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(vpX,vpY); ctx.lineTo(w-edgeOffset,topY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(vpX,vpY); ctx.lineTo(w-edgeOffset-40,bottomY); ctx.stroke();
}

/* ---------- FLOCKING ---------- */
function flock(b){
  let ax=0, ay=0, cx=0, cy=0, sx=0, sy=0, n=0;
  for(const o of birds){
    if(o===b) continue;
    const dx=o.x-b.x, dy=o.y-b.y;
    const d=Math.hypot(dx,dy);
    if(d>0 && d<90){
      ax+=o.vx; ay+=o.vy; cx+=o.x; cy+=o.y;
      if(d<22){ sx-=dx/d; sy-=dy/d; }
      n++;
    }
  }
  if(n){
    ax/=n; ay/=n; cx=cx/n-b.x; cy=cy/n-b.y;
    b.ax+=ax*0.03; b.ay+=ay*0.03; b.ax+=cx*0.002; b.ay+=cy*0.002;
    b.ax+=sx*0.06; b.ay+=sy*0.06;
  }
}

/* ---------- ANIMATE ---------- */
function animate(){
    drawSky();
    drawRoad();
    drawPoles();
    drawPowerLines();

    for(const b of birds) flock(b);

    for(const b of birds){
        b.vx+=b.ax; b.vy+=b.ay;
        let speed=Math.hypot(b.vx,b.vy);
        if(speed>3){ b.vx=b.vx/speed*3; b.vy=b.vy/speed*3; }
        b.x+=b.vx; b.y+=b.vy;

        const m=220;
        if(b.x<m) b.vx+=0.18;
        if(b.x>w-m) b.vx-=0.18;
        if(b.y<m) b.vy+=0.18;
        if(b.y>vpY*0.8) b.vy-=0.18;

        b.ax=b.ay=0; b.wing+=speed*0.25;

        const a=Math.atan2(b.vy,b.vx);
        const flap=Math.sin(b.wing)*3;
        ctx.save();
        ctx.translate(b.x,b.y);
        ctx.rotate(a);
        ctx.strokeStyle="rgba(255,255,255,0.9)";
        ctx.lineWidth=1.1;
        ctx.beginPath();
        ctx.moveTo(0,0); ctx.lineTo(-7,-3-flap*0.3);
        ctx.moveTo(0,0); ctx.lineTo(-7,3+flap*0.3);
        ctx.stroke();
        ctx.restore();
    }

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
