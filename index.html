<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration with Road & Poles</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black;}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
window.addEventListener("resize",()=>{ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; });

/* ---------- SKY ---------- */
const skyStages=[
  {top:[255,100,0], bottom:[255,180,80]}, // Sunset
  {top:[20,30,70], bottom:[30,40,100]},   // Deep Blue
  {top:[0,0,0], bottom:[0,0,0]},          // Night
  {top:[200,120,180], bottom:[255,200,180]}, // Sunrise
  {top:[135,206,250], bottom:[255,255,255]} // Day
];
function clamp(n){ return Math.min(255, Math.max(0, Math.round(n))); }
function lerp(a,b,f){ return clamp(a+(b-a)*f); }
function drawSky(t){
  const cycle=120000;
  const total=skyStages.length;
  const progress=(t%cycle)/cycle*total;
  const idx=Math.floor(progress);
  const next=(idx+1)%total;
  const f=progress-idx;

  const top=[], bottom=[];
  for(let i=0;i<3;i++){ top[i]=lerp(skyStages[idx].top[i],skyStages[next].top[i],f); bottom[i]=lerp(skyStages[idx].bottom[i],skyStages[next].bottom[i],f); }

  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, `rgb(${top[0]},${top[1]},${top[2]})`);
  grad.addColorStop(1, `rgb(${bottom[0]},${bottom[1]},${bottom[2]})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

/* ---------- ROAD & POLES ---------- */
const poleCount = 12;
const horizonY = h*0.3;
const roadWidthBase = 100;
let polePositions = [];
for(let i=0;i<poleCount;i++){
  polePositions.push({y: horizonY + i*(h - horizonY)/poleCount});
}

function drawRoadAndPoles(){
  // Road first
  ctx.fillStyle="#333";
  ctx.beginPath();
  ctx.moveTo(w/2 - roadWidthBase, h);
  ctx.lineTo(w/2 + roadWidthBase, h);
  ctx.lineTo(w/2 + roadWidthBase, horizonY);
  ctx.lineTo(w/2 - roadWidthBase, horizonY);
  ctx.closePath();
  ctx.fill();

  // Poles and power lines
  ctx.strokeStyle="#555";
  ctx.lineWidth=2;
  for(let p of polePositions){
    const scale = 1 - (p.y - horizonY)/(h - horizonY)*0.8; // perspective scaling
    const y = p.y;
    const leftX = w/2 - 120*scale;
    const rightX = w/2 + 120*scale;
    const poleH = 150*scale;

    // only draw if numbers are finite
    if(isFinite(y) && isFinite(leftX) && isFinite(rightX) && isFinite(poleH)){
      ctx.beginPath();
      ctx.moveTo(leftX, y); ctx.lineTo(leftX, y - poleH);
      ctx.moveTo(rightX, y); ctx.lineTo(rightX, y - poleH);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(leftX, y - poleH*0.7); ctx.lineTo(rightX, y - poleH*0.7);
      ctx.stroke();
    }
  }
}

function updatePoles(){
  for(let p of polePositions){
    p.y += 2;
    if(p.y>h) p.y = horizonY;
  }
}

/* ---------- BIRDS ---------- */
const birds=[];
const COUNT=340;
for(let i=0;i<COUNT;i++){
  const a=Math.random()*Math.PI*2;
  birds.push({x:Math.random()*w,y:Math.random()*h,vx:Math.cos(a),vy:Math.sin(a),ax:0,ay:0,wing:Math.random()*Math.PI*2});
}

function flock(b){
  let ax=0,ay=0,cx=0,cy=0,sx=0,sy=0,n=0;
  for(const o of birds){
    if(o===b) continue;
    const dx=o.x-b.x, dy=o.y-b.y, d=Math.hypot(dx,dy);
    if(d>0 && d<90){ ax+=o.vx; ay+=o.vy; cx+=o.x; cy+=o.y; if(d<22){ sx-=dx/d; sy-=dy/d;} n++; }
  }
  if(n){ ax/=n; ay/=n; cx=cx/n-b.x; cy=cy/n-b.y; b.ax+=ax*0.03; b.ay+=ay*0.03; b.ax+=cx*0.002; b.ay+=cy*0.002; b.ax+=sx*0.06; b.ay+=sy*0.06; }
}

/* ---------- ANIMATE ---------- */
function animate(t){
  drawSky(t);           // BACKGROUND
  updatePoles();        // POLE POSITION
  drawRoadAndPoles();   // ROAD + POLES
  for(const b of birds) flock(b); // FLOCKING
  for(const b of birds){           // DRAW BIRDS
    b.vx+=b.ax; b.vy+=b.ay;
    let speed=Math.hypot(b.vx,b.vy);
    if(speed>3){ b.vx=b.vx/speed*3; b.vy=b.vy/speed*3;}
    b.x+=b.vx; b.y+=b.vy;

    const m=220;
    if(b.x<m) b.vx+=0.18; if(b.x>w-m) b.vx-=0.18;
    if(b.y<m) b.vy+=0.18;
