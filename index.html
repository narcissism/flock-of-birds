<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration with Road & Poles</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black;}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
window.addEventListener("resize", ()=>{ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; });

/* ---------- SKY STAGES ---------- */
const skyStages = [
  {top:[255,100,0], bottom:[255,180,80]},   // Sunset
  {top:[20,30,70], bottom:[30,40,100]},     // Deep Blue
  {top:[0,0,0], bottom:[0,0,0]},            // Night
  {top:[200,120,180], bottom:[255,200,180]},// Sunrise
  {top:[135,206,250], bottom:[255,255,255]} // Day
];

function clamp(n){ return Math.min(255, Math.max(0, Math.round(n))); }
function lerp(a,b,f){ return clamp(a+(b-a)*f); }
function drawSky(t){
  const cycle=120000; // 2min full loop
  const total=skyStages.length;
  const progress=(t%cycle)/cycle*total;
  const idx=Math.floor(progress);
  const next=(idx+1)%total;
  const f=progress-idx;

  let top=[], bottom=[];
  for(let i=0;i<3;i++){
    top[i]=lerp(skyStages[idx].top[i], skyStages[next].top[i], f);
    bottom[i]=lerp(skyStages[idx].bottom[i], skyStages[next].bottom[i], f);
  }

  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, `rgb(${top[0]},${top[1]},${top[2]})`);
  grad.addColorStop(1, `rgb(${bottom[0]},${bottom[1]},${bottom[2]})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

/* ---------- ROAD & POLES ---------- */
const poleCount = 12;
const horizon = h*0.3;
let poles = [];
for(let i=0;i<poleCount;i++){
  poles.push({
    z: i*200 + 100, // distance from camera
  });
});

function drawRoadAndPoles(){
  // Road converges to horizon
  const roadLeft = (x)=> w/2 - 100*(horizon/x);
  const roadRight = (x)=> w/2 + 100*(horizon/x);

  // Draw road
  ctx.fillStyle="#333";
  ctx.beginPath();
  ctx.moveTo(roadLeft(poles[poleCount-1].z),h);
  ctx.lineTo(roadRight(poles[poleCount-1].z),h);
  ctx.lineTo(roadRight(poles[0].z),horizon);
  ctx.lineTo(roadLeft(poles[0].z),horizon);
  ctx.closePath();
  ctx.fill();

  // Draw poles and power lines
  ctx.strokeStyle="#555";
  ctx.lineWidth=2;
  for(let p of poles){
    const y = h - (horizon/p.z)*h; // closer poles lower on screen
    const scale = horizon/p.z;
    const leftX = w/2 - 120*scale;
    const rightX = w/2 + 120*scale;
    const poleH = 150*scale;

    // Pole vertical lines
    ctx.beginPath();
    ctx.moveTo(leftX, y);
    ctx.lineTo(leftX, y - poleH);
    ctx.moveTo(rightX, y);
    ctx.lineTo(rightX, y - poleH);
    ctx.stroke();

    // Power lines
    ctx.beginPath();
    ctx.moveTo(leftX, y - poleH*0.7);
    ctx.lineTo(rightX, y - poleH*0.7);
    ctx.stroke();
  }
}

/* Move poles toward camera */
function updatePoles(){
  for(let p of poles){
    p.z -= 2; // speed
    if(p.z<50) p.z = poleCount*200 + Math.random()*100;
  }
}

/* ---------- BIRDS ---------- */
const birds=[];
const COUNT=340;
for(let i=0;i<COUNT;i++){
  const a=Math.random()*Math.PI*2;
  birds.push({x:Math.random()*w, y:Math.random()*h, vx:Math.cos(a), vy:Math.sin(a), ax:0, ay:0, wing:Math.random()*Math.PI*2});
}

function flock(b){
  let ax=0, ay=0, cx=0, cy=0, sx=0, sy=0, n=0;
  for(const o of birds){
    if(o===b) continue;
    const dx=o.x-b.x, dy=o.y-b.y, d=Math.hypot(dx,dy);
    if(d>0 && d<90){ ax+=o.vx; ay+=o.vy; cx+=o.x; cy+=o.y; if(d<22){ sx-=dx/d; sy-=dy/d;} n++; }
  }
  if(n){ ax/=n; ay/=n; cx=cx/n-b.x; cy=cy/n-b.y; b.ax+=ax*0.03; b.ay+=ay*0.03; b.ax+=cx*0.002; b.ay+=cy*0.002; b.ax+=sx*0.06; b.ay+=sy*0.06; }
}

/* ---------- ANIMATE ---------- */
function animate(t){
  drawSky(t);
  updatePoles();
  drawRoadAndPoles();

  for(const b of birds) flock(b);
  for(const b of birds){
    b.vx+=b.ax; b.vy+=b.ay;
    let speed=Math.hypot(b.vx,b.vy);
    if(speed>3){ b.vx=b.vx/speed*3; b.vy=b.vy/speed*3;}
    b.x+=b.vx; b.y+=b.vy;

    const m=220;
    if(b.x<m) b.vx+=0.18; if(b.x>w-m) b.vx-=0.18;
    if(b.y<m) b.vy+=0.18; if(b.y>h-m) b.vy-=0.18;

    b.ax=b.ay=0; b.wing+=speed*0.25;

    const a=Math.atan2(b.vy,b.vx); const flap=Math.sin(b.wing)*3;
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(a);
    ctx.strokeStyle="rgba(255,255,255,0.95)"; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-10,-4-flap*0.4); ctx.moveTo(0,0); ctx.lineTo(-10,4+flap*0.4); ctx.stroke();
    ctx.restore();
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
