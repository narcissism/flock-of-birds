<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration Road Scene</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, vpX, vpY;
const birds = [];
const COUNT = 300;
let poles = [];
const POLE_COUNT = 6;
const edgeOffset = 50;
let powerLines = [];

/* --------------------
   RESIZE CANVAS
-------------------- */
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  vpX = w / 2;
  vpY = h * 0.55;

  createBirds();
  createPolesAndLines();
}
window.addEventListener("resize", resize);
resize();

/* --------------------
   CREATE BIRDS
-------------------- */
function createBirds() {
  birds.length = 0;
  for(let i=0;i<COUNT;i++){
    birds.push({
      x: Math.random()*w,
      y: Math.random()*h,
      vx: Math.random()*2-1,
      vy: Math.random()*2-1,
      wing: Math.random()*Math.PI*2
    });
  }
}

/* --------------------
   CREATE POLES & POWERLINES
-------------------- */
function createPolesAndLines() {
  poles = [];
  powerLines = [];
  for(let i=0;i<POLE_COUNT;i++){
    poles.push({t:i/(POLE_COUNT-1)});
  }

  const endYTop = h*0.75;
  const endYBottom = h*0.77;
  powerLines = [
    {x: vpX, y: vpY, ex: edgeOffset, ey: endYTop},
    {x: vpX, y: vpY, ex: edgeOffset+40, ey: endYBottom},
    {x: vpX, y: vpY, ex: w-edgeOffset, ey: endYTop},
    {x: vpX, y: vpY, ex: w-edgeOffset-40, ey: endYBottom}
  ];
}

/* --------------------
   DRAW SKY
-------------------- */
function drawSky() {
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"#0b1026");
  grad.addColorStop(0.5,"#5a246d");
  grad.addColorStop(0.8,"#c95a3a");
  grad.addColorStop(1,"#f6b26b");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

/* --------------------
   DRAW POLES
-------------------- */
function drawPoles(){
  ctx.fillStyle = "saddlebrown";
  for(let p of poles){
    p.t += 0.003;
    if(p.t>1) p.t=0;

    const y = vpY + (h - vpY) * p.t;
    const xLeft = vpX - (vpX - edgeOffset) * p.t;
    const xRight = vpX + (w - vpX - edgeOffset) * p.t;
    const poleHeight = 1 + 200*p.t;
    const poleWidth = Math.max(1, 1 + 10*p.t);
    const topLeftY = y - poleHeight;
    const topRightY = y - poleHeight;

    ctx.fillRect(xLeft - poleWidth/2, topLeftY, poleWidth, poleHeight);
    ctx.fillRect(xRight - poleWidth/2, topRightY, poleWidth, poleHeight);
  }
}

/* --------------------
   DRAW ROAD
-------------------- */
function drawRoad(){
  ctx.fillStyle="#333";
  ctx.beginPath();
  ctx.moveTo(vpX,vpY);
  ctx.lineTo(w,h);
  ctx.lineTo(0,h);
  ctx.closePath();
  ctx.fill();

  ctx.setLineDash([30,30]);
  ctx.strokeStyle="yellow";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(vpX,vpY);
  ctx.lineTo(w/2,h);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* --------------------
   DRAW POWERLINES
-------------------- */
function drawPowerLines(){
  ctx.strokeStyle = "black";
  ctx.lineWidth = 2;
  for(let line of powerLines){
    ctx.beginPath();
    ctx.moveTo(line.x,line.y);
    ctx.lineTo(line.ex,line.ey);
    ctx.stroke();
  }
}

   DRAW BIRDS WITH MURMURATION
