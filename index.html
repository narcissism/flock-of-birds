<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration Road</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, vpX, vpY;
const birds = [];
const COUNT = 300;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  vpX = w/2;
  vpY = h*0.55;

  // Recreate birds after knowing canvas size
  birds.length = 0;
  for(let i=0;i<COUNT;i++){
    birds.push({
      x: Math.random()*w,
      y: Math.random()*vpY*0.8,  // spawn above road
      vx: Math.random()*2-1,
      vy: Math.random()*2-1,
      wing: Math.random()*Math.PI*2
    });
  }
}
window.addEventListener("resize", resize);
resize();

/* ---------- DRAW SKY ---------- */
function drawSky(){
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"#0b1026");
  grad.addColorStop(0.5,"#5a246d");
  grad.addColorStop(0.8,"#c95a3a");
  grad.addColorStop(1,"#f6b26b");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

/* ---------- DRAW ROAD ---------- */
function drawRoad(){
  ctx.fillStyle="#333";
  ctx.beginPath();
  ctx.moveTo(vpX,vpY);
  ctx.lineTo(w,h);
  ctx.lineTo(0,h);
  ctx.closePath();
  ctx.fill();

  ctx.setLineDash([30,30]);
  ctx.strokeStyle="yellow";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(vpX,vpY);
  ctx.lineTo(w/2,h);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ---------- DRAW BIRDS ---------- */
function drawBirds(){
  for(const b of birds){
    b.x += b.vx;
    b.y += b.vy;

    // Bounce off edges
    if(b.x<0||b.x>w) b.vx*=-1;
    if(b.y<0||b.y>vpY*0.8) b.vy*=-1;

    b.wing+=0.2;
    const a = Math.atan2(b.vy,b.vx);
    const flap = Math.sin(b.wing)*3;

    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.rotate(a);
    ctx.strokeStyle="white";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(-8,-4-flap*0.5);
    ctx.moveTo(0,0);
    ctx.lineTo(-8,4+flap*0.5);
    ctx.stroke();
    ctx.restore();
  }
}

/* ---------- ANIMATE ---------- */
function animate(){
  drawSky();
  drawRoad();
  drawBirds();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
