<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration</title>
<style>
html, body {
  margin:0;
  padding:0;
  overflow:hidden;
  width:100%;
  height:100%;
  background:black; 
}
canvas { display:block; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, vpX, vpY;
let poles = [];
const POLE_COUNT = 6;
const edgeOffset = 50;
let dashOffset = 0;
let skyTime = 0;

/* ---------- CURSOR ---------- */
let cursor = { x: -1000, y: -1000 }; // start off-screen
window.addEventListener("mousemove", e => {
  cursor.x = e.clientX;
  cursor.y = e.clientY;
});

/* ---------- BIRDS ---------- */
const birds = [];
const BIRD_COUNT = 420;

/* ---------- RESIZE ---------- */
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  vpX = w / 2;
  vpY = h * 0.55;
  createPoles();
  createBirds();
}
window.addEventListener("resize", resize);
resize();

/* ---------- CREATE POLES ---------- */
function createPoles(){
  poles = [];
  for(let i = 0; i < POLE_COUNT; i++){
    poles.push({ t: i / (POLE_COUNT - 1) });
  }
}

/* ---------- CREATE BIRDS ---------- */
function createBirds(){
  birds.length = 0;
  for(let i = 0; i < BIRD_COUNT; i++){
    const a = Math.random() * Math.PI * 2;
    birds.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: Math.cos(a),
      vy: Math.sin(a),
      ax: 0,
      ay: 0,
      wing: Math.random() * Math.PI * 2
    });
  }
}

/* ---------- COLOR LERP ---------- */
function lerpColor(c0, c1, f){
  function hex2rgb(h){
    const n = parseInt(h.slice(1),16);
    return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
  }
  const a = hex2rgb(c0);
  const b = hex2rgb(c1);
  return `rgb(${(a.r+(b.r-a.r)*f)|0},
              ${(a.g+(b.g-a.g)*f)|0},
              ${(a.b+(b.b-a.b)*f)|0})`;
}

/* ---------- SKY ---------- */
function drawSky(){
  skyTime += 0.0005;
  if(skyTime > 1) skyTime = 0;

  const colors = [
    {t:0,   top:"#c95a3a", mid:"#5a246d", bottom:"#0b1026"},
    {t:0.25,top:"#050a1f", mid:"#0b1026", bottom:"#1a1a3a"},
    {t:0.5, top:"#f6b26b", mid:"#c95a3a", bottom:"#5a246d"},
    {t:0.75,top:"#87ceeb", mid:"#5ac3d1", bottom:"#c95a3a"},
    {t:1,   top:"#c95a3a", mid:"#5a246d", bottom:"#0b1026"}
  ];

  let i = 0;
  while(i < colors.length-1 && skyTime > colors[i+1].t) i++;
  const f = (skyTime - colors[i].t) / (colors[i+1].t - colors[i].t);

  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, lerpColor(colors[i].top, colors[i+1].top, f));
  grad.addColorStop(0.5, lerpColor(colors[i].mid, colors[i+1].mid, f));
  grad.addColorStop(1, lerpColor(colors[i].bottom, colors[i+1].bottom, f));

  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

/* ---------- ROAD ---------- */
function drawRoad(){
  ctx.fillStyle = "#333";
  ctx.beginPath();
  ctx.moveTo(vpX, vpY);
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fill();

  dashOffset -= 2;
  ctx.setLineDash([30,30]);
  ctx.lineDashOffset = dashOffset;
  ctx.strokeStyle = "yellow";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(vpX, vpY);
  ctx.lineTo(w/2, h);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ---------- POLES ---------- */
function drawPoles(){
  ctx.fillStyle = "saddlebrown";

  for(let p of poles){
    p.t += 0.002;
    if(p.t > 1) p.t = 0;

    const yBase = vpY + (h - vpY) * p.t;
    const xL = vpX - (vpX - edgeOffset) * p.t;
    const xR = vpX + (w - vpX - edgeOffset) * p.t;

    const yTop = yBase * (1 - p.t);
    const width = 2 + 10 * p.t;

    ctx.fillRect(xL - width/2, yTop, width, yBase - yTop);
    ctx.fillRect(xR - width/2, yTop, width, yBase - yTop);
  }
}

/* ---------- POWER LINES ---------- */
function drawPowerLines(){
  ctx.strokeStyle = "black";
  ctx.lineWidth = 2;

  const yEnd = h * (2/6); // fixed 2/6 from top

  // LEFT
  ctx.beginPath(); ctx.moveTo(vpX, vpY); ctx.lineTo(0, yEnd); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(vpX, vpY); ctx.lineTo(40, yEnd + 20); ctx.stroke();

  // RIGHT
  ctx.beginPath(); ctx.moveTo(vpX, vpY); ctx.lineTo(w, yEnd); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(vpX, vpY); ctx.lineTo(w - 40, yEnd + 20); ctx.stroke();
}

/* ---------- FLOCKING ---------- */
function flock(b){
  let ax=0, ay=0, cx=0, cy=0, sx=0, sy=0, n=0;

  for(const o of birds){
    if(o===b) continue;
    const dx=o.x-b.x, dy=o.y-b.y;
    const d=Math.hypot(dx,dy);
    if(d>0 && d<90){
      ax+=o.vx; ay+=o.vy;
      cx+=o.x; cy+=o.y;
      if(d<25){ sx-=dx/d; sy-=dy/d; }
      n++;
    }
  }

  if(n){
    ax/=n; ay/=n;
    cx=cx/n-b.x; cy=cy/n-b.y;
    // stronger cohesion/alignment to swarm when groups meet
    b.ax+=ax*0.04; 
    b.ay+=ay*0.04;
    b.ax+=cx*0.003; 
    b.ay+=cy*0.003;
    b.ax+=sx*0.07; 
    b.ay+=sy*0.07;
  }

  // repel from cursor
  const dx = cursor.x - b.x;
  const dy = cursor.y - b.y;
  const dist = Math.hypot(dx,dy);
  if(dist < 100){
    b.ax -= (dx / dist) * (0.3 * (100 - dist)/100);
    b.ay -= (dy / dist) * (0.3 * (100 - dist)/100);
  }
}
  
/* ---------- DRAW BIRDS (TOP LAYER) ---------- */
function drawBirds(){

  // small wind drift
  windAngle += (Math.random() - 0.5) * 0.002;
  const wx = Math.cos(windAngle) * 0.02;
  const wy = Math.sin(windAngle) * 0.015;
  
  for(const b of birds) flock(b);

  for(const b of birds){
    b.vx += b.ax;
    b.vy += b.ay;

    const s=Math.hypot(b.vx,b.vy);
    if(s>2.0){ b.vx=b.vx/s*2.0; b.vy=b.vy/s*2.0; } // slower

    b.x += b.vx; b.y += b.vy;

    // initialize persistent swirl offset
    if (b.swirlOffset === undefined) b.swirlOffset = Math.random() * Math.PI * 2;

    // Organic swirl
    const swirlStrength = 0.03;
    b.swirlOffset += 0.03;
    b.ax += Math.cos(b.swirlOffset) * swirlStrength;
    b.ay += Math.sin(b.swirlOffset) * swirlStrength;

    // Apply acceleration + wind
    b.vx += b.ax + wx;
    b.vy += b.ay + wy;

    // soft edge containment
    const margin = 60;
    const turn = 0.12;
    if(b.x < margin) b.vx += turn;
    if(b.x > w - margin) b.vx -= turn;
    if(b.y < margin) b.vy += turn;
    if(b.y > h - margin) b.vy -= turn;

    b.ax = b.ay = 0;
    b.wing += s * 0.25;

    const a = Math.atan2(b.vy, b.vx);
    const flap = Math.sin(b.wing) * 4; // slightly larger

    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.rotate(a);
    ctx.strokeStyle = "rgba(255,255,255,0.95)";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(-9,-4-flap*0.4);
    ctx.moveTo(0,0);
    ctx.lineTo(-9,4+flap*0.4);
    ctx.stroke();
    ctx.restore();
  }

// Track mouse for repulsion
window.addEventListener("mousemove", e => {
  window.mouseX = e.clientX;
  window.mouseY = e.clientY;
});
window.addEventListener("mouseout", () => {
  window.mouseX = -9999;
  window.mouseY = -9999;
});

}

/* ---------- ANIMATE ---------- */
function animate(){
  drawSky();
  drawPoles();
  drawRoad();
  drawPowerLines();
  drawBirds(); // topmost layer
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
