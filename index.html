<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Murmuration</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* --------------------
   TIME OF DAY
-------------------- */
function skyColor(t) {
  // slow cycle: ~2 minutes per full loop
  const cycle = (Math.sin(t * 0.00005) + 1) / 2;

  const top = {
    r: 11 + cycle * 20,
    g: 16 + cycle * 30,
    b: 38 + cycle * 90
  };

  const bottom = {
    r: 246 - cycle * 120,
    g: 178 - cycle * 80,
    b: 107 - cycle * 40
  };

  return { top, bottom };
}

function drawSky(t) {
  const c = skyColor(t);
  const g = ctx.createLinearGradient(0, 0, 0, h);

  g.addColorStop(
    0,
    `rgb(${c.top.r},${c.top.g},${c.top.b})`
  );
  g.addColorStop(
    1,
    `rgb(${c.bottom.r},${c.bottom.g},${c.bottom.b})`
  );

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}

/* --------------------
   BIRDS
-------------------- */
const birds = [];
const COUNT = 360; // same density, slightly tighter feel

for (let i = 0; i < COUNT; i++) {
  const a = Math.random() * Math.PI * 2;
  birds.push({
    x: Math.random() * w,
    y: Math.random() * h,
    vx: Math.cos(a),
    vy: Math.sin(a),
    ax: 0,
    ay: 0,
    wing: Math.random() * Math.PI * 2
  });
}

/* --------------------
   FLOCKING (TIGHTER)
-------------------- */
function flock(b, others) {
  let ax = 0, ay = 0, cx = 0, cy = 0, sx = 0, sy = 0, n = 0;

  for (const o of others) {
    if (o === b) continue;
    const dx = o.x - b.x;
    const dy = o.y - b.y;
    const d = Math.hypot(dx, dy);

    if (d > 0 && d < 85) {
      ax += o.vx;
      ay += o.vy;
      cx += o.x;
      cy += o.y;
      if (d < 22) {
        sx -= dx / d;
        sy -= dy / d;
      }
      n++;
    }
  }

  if (n > 0) {
    ax /= n; ay /= n;
    cx = cx / n - b.x;
    cy = cy / n - b.y;

    // tighter cohesion & alignment
    b.ax += ax * 0.03;
    b.ay += ay * 0.03;
    b.ax += cx * 0.002;
    b.ay += cy * 0.002;
    b.ax += sx * 0.06;
    b.ay += sy * 0.06;
  }
}

/* --------------------
   ANIMATION
-------------------- */
function animate(t) {
  drawSky(t);

  for (const b of birds) flock(b, birds);

  for (const b of birds) {
    b.vx += b.ax;
    b.vy += b.ay;

    const speed = Math.hypot(b.vx, b.vy);
    const max = 3;
    if (speed > max) {
      b.vx = (b.vx / speed) * max;
      b.vy = (b.vy / speed) * max;
    }

    b.x += b.vx;
    b.y += b.vy;

    // edge anticipation
    const m = 220;
    if (b.x < m) b.vx += 0.18;
    if (b.x > w - m) b.vx -= 0.18;
    if (b.y < m) b.vy += 0.18;
    if (b.y > h - m) b.vy -= 0.18;

    b.ax = b.ay = 0;
    b.wing += speed * 0.25;

    // draw bird
    const a = Math.atan2(b.vy, b.vx);
    const flap = Math.sin(b.wing) * 3;

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(a);
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.lineWidth = 1.1;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-7, -3 - flap * 0.3);
    ctx.moveTo(0, 0);
    ctx.lineTo(-7, 3 + flap * 0.3);
    ctx.stroke();

    ctx.restore();
  }

  requestAnimationFrame(animate);
}

animate();
</script>
