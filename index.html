<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murmuration with Road & Poles</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:black;}
canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
window.addEventListener("resize",()=>{ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; });

/* ---------- SKY ---------- */
const skyStages=[
  {top:[255,100,0], bottom:[255,180,80]},
  {top:[20,30,70], bottom:[30,40,100]},
  {top:[0,0,0], bottom:[0,0,0]},
  {top:[200,120,180], bottom:[255,200,180]},
  {top:[135,206,250], bottom:[255,255,255]}
];
function clamp(n){ return Math.min(255, Math.max(0, Math.round(n))); }
function lerp(a,b,f){ return clamp(a+(b-a)*f); }
function drawSky(t){
  const cycle=120000;
  const total=skyStages.length;
  const progress=(t%cycle)/cycle*total;
  const idx=Math.floor(progress);
  const next=(idx+1)%total;
  const f=progress-idx;

  const top=[], bottom=[];
  for(let i=0;i<3;i++){ top[i]=lerp(skyStages[idx].top[i],skyStages[next].top[i],f); bottom[i]=lerp(skyStages[idx].bottom[i],skyStages[next].bottom[i],f); }

  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, `rgb(${top[0]},${top[1]},${top[2]})`);
  grad.addColorStop(1, `rgb(${bottom[0]},${bottom[1]},${bottom[2]})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}

/* ---------- SAFE ROAD & POLES ---------- */
const poleCount = 12;
const horizonY = h*0.3;
const roadWidthBase = 100;
let polePositions = [];
for(let i=0;i<poleCount;i++){
  let y = horizonY + (h-horizonY)/poleCount*i;
  polePositions.push({y: y});
}

function drawRoadAndPoles(){
  // Draw road
  ctx.fillStyle="#333";
  ctx.beginPath();
  ctx.moveTo(w/2 - roadWidthBase, h);
  ctx.lineTo(w/2 + roadWidthBase, h);
  ctx.lineTo(w/2 + roadWidthBase, horizonY);
  ctx.lineTo(w/2 - roadWidthBase, horizonY);
  ctx.closePath();
  ctx.fill();

  // Draw poles and power lines
  ctx.strokeStyle="#555";
  ctx.lineWidth=2;
  for(let i=0;i<polePositions.length;i++){
    const scale = 1 - (polePositions[i].y - horizonY)/(h - horizonY)*0.8; // simulate perspective
    const y = polePositions[i].y;
