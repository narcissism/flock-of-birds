<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Murmuration</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  background: black;
}
canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
window.addEventListener("resize", () => {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
});

/* ---------- BIRDS ---------- */
const birds = [];
const COUNT = 340;
for (let i=0;i<COUNT;i++){
  const a=Math.random()*Math.PI*2;
  birds.push({x:Math.random()*w,y:Math.random()*h,vx:Math.cos(a),vy:Math.sin(a),ax:0,ay:0,wing:Math.random()*Math.PI*2});
}

/* ---------- DAY-NIGHT STAGES ---------- */
const skyStages = [
  {top:[255,100,0], bottom:[255,180,80]},  // Sunset
  {top:[10,10,35], bottom:[20,20,50]},     // Night
  {top:[200,120,180], bottom:[255,200,180]}, // Sunrise
  {top:[135,206,250], bottom:[255,255,255]}  // Day
];

function lerp(a,b,f){ return Math.floor(a+(b-a)*f); }

function drawSky(t){
  const stageCount = skyStages.length;
  const cycleTime = 40000; // 40s full loop
  let loop = ((t%cycleTime)/cycleTime)*stageCount;
  let idx = Math.floor(loop);
  let nextIdx = (idx+1)%stageCount;
  let f = loop-idx;

  const top=[];
  const bottom=[];
  for(let i=0;i<3;i++){
    top[i]=lerp(skyStages[idx].top[i],skyStages[nextIdx].top[i],f);
    bottom[i]=lerp(skyStages[idx].bottom[i],skyStages[nextIdx].bottom[i],f);
  }

  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,`rgb(${top[0]},${top[1]},${top[2]})`);
  grad.addColorStop(1,`rgb(${bottom[0]},${bottom[1]},${bottom[2]})`);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,w,h);
}

/* ---------- FLOCKING ---------- */
function flock(b){
  let ax=0, ay=0, cx=0, cy=0, sx=0, sy=0, n=0;
  for(const o of birds){
    if(o===b) continue;
    const dx=o.x-b.x, dy=o.y-b.y, d=Math.hypot(dx,dy);
    if(d>0 && d<90){ ax+=o.vx; ay+=o.vy; cx+=o.x; cy+=o.y; if(d<22){ sx-=dx/d; sy-=dy/d;} n++; }
  }
  if(n){ ax/=n; ay/=n; cx=cx/n-b.x; cy=cy/n-b.y;
    b.ax+=ax*0.03; b.ay+=ay*0.03; b.ax+=cx*0.002; b.ay+=cy*0.002; b.ax+=sx*0.06; b.ay+=sy*0.06;
  }
}

/* ---------- ANIMATE ---------- */
function animate(t){
  drawSky(t);
  for(const b of birds) flock(b);
  for(const b of birds){
    b.vx+=b.ax; b.vy+=b.ay;
    let speed=Math.hypot(b.vx,b.vy);
    if(speed>3){ b.vx=b.vx/speed*3; b.vy=b.vy/speed*3;}
    b.x+=b.vx; b.y+=b.vy;

    const m=220;
    if(b.x<m) b.vx+=0.18; if(b.x>w-m) b.vx-=0.18;
    if(b.y<m) b.vy+=0.18; if(b.y>h-m) b.vy-=0.18;

    b.ax=b.ay=0; b.wing+=speed*0.25;

    const a=Math.atan2(b.vy,b.vx); const flap=Math.sin(b.wing)*3;
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(a);
    ctx.strokeStyle="rgba(255,255,255,0.9)"; ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-7,-3-flap*0.3); ctx.moveTo(0,0); ctx.lineTo(-7,3+flap*0.3); ctx.stroke();
    ctx.restore();
  }
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
